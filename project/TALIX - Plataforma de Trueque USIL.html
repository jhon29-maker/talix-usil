<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALIX — Trueque Universitario USIL</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="talix-data.js"></script>
<script src="talix-firebase.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#1B4FBE">
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="300" fill="#1B4FBE"/>
    <circle cx="200" cy="150" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <circle cx="200" cy="150" r="90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <text x="200" y="145" text-anchor="middle" font-size="52" font-family="sans-serif">♻️</text>
    <text x="200" y="190" text-anchor="middle" font-size="30" font-weight="800" font-family="sans-serif" fill="white" letter-spacing="-1">TALIX</text>
    <text x="200" y="212" text-anchor="middle" font-size="11" font-family="sans-serif" fill="rgba(255,255,255,0.6)">Trueque Universitario · USIL</text>
  </svg>
</template>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; font-family: 'Poppins', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C8D8C8; border-radius: 100px; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>
<script src="talix-ui.jsx" type="text/babel"></script>
<script src="talix-screens.jsx" type="text/babel"></script>
<script src="talix-admin.jsx" type="text/babel"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const THEMES = {
  azul:      { name:"Azul Marino",  primary:"#1B4FBE", accent:"#F5A623", bg:"#F0F4FA" },
  verde:     { name:"Verde USIL",   primary:"#1A7A50", accent:"#F5A623", bg:"#F4F6F0" },
  terracota: { name:"Terracota",    primary:"#C0533A", accent:"#2D9B6F", bg:"#FAF3F0" },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "azul",
  "density": "normal",
  "cardStyle": "redondeado"
}/*EDITMODE-END*/;

// ── TWEAKS PANEL ──────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const theme = THEMES[tweaks.theme] || THEMES.azul;
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:9999, background:'#fff', borderRadius:20, padding:24, width:260, boxShadow:'0 8px 40px rgba(0,0,0,0.18)', border:'1px solid #EEE', fontFamily:'Poppins, sans-serif' }}>
      <div style={{ fontWeight:700, fontSize:15, color:'#1C2B2B', marginBottom:18 }}>🎨 Tweaks</div>
      <div style={{ marginBottom:18 }}>
        <label style={{ fontSize:11, fontWeight:600, color:'#999', display:'block', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.5px' }}>Color del tema</label>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {Object.entries(THEMES).map(([key, t]) => (
            <button key={key} onClick={()=>setTweaks(tw=>({...tw,theme:key}))} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', border:`2px solid ${tweaks.theme===key?t.primary:'#EEE'}`, borderRadius:12, background:tweaks.theme===key?`${t.primary}10`:'#FAFAFA', cursor:'pointer', fontFamily:'Poppins', fontWeight:600, fontSize:13, color:tweaks.theme===key?t.primary:'#666', transition:'all 0.15s' }}>
              <div style={{ width:20, height:20, borderRadius:'50%', background:t.primary }} />{t.name}
            </button>
          ))}
        </div>
      </div>
      <div style={{ marginBottom:16 }}>
        <label style={{ fontSize:11, fontWeight:600, color:'#999', display:'block', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.5px' }}>Densidad</label>
        <div style={{ display:'flex', gap:6 }}>
          {['compacto','normal','espacioso'].map(d=>(
            <button key={d} onClick={()=>setTweaks(tw=>({...tw,density:d}))} style={{ flex:1, padding:'8px 4px', border:`2px solid ${tweaks.density===d?theme.primary:'#EEE'}`, borderRadius:10, background:tweaks.density===d?`${theme.primary}12`:'#FAFAFA', cursor:'pointer', fontFamily:'Poppins', fontWeight:600, fontSize:11, color:tweaks.density===d?theme.primary:'#888', transition:'all 0.15s', textTransform:'capitalize' }}>{d}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────
function Sidebar({ page, setPage, currentUser, theme, onLogout }) {
  const nav = [
    { key:'feed',         icon:'🏠', label:'Inicio' },
    { key:'post',         icon:'➕', label:'Publicar' },
    { key:'chat',         icon:'💬', label:'Mensajes' },
    { key:'dashboard',    icon:'🌿', label:'Impacto CO₂' },
    { key:'profile',      icon:'👤', label:'Mi Perfil' },
  ];
  return (
    <div style={{ width:220, background:theme.primary, display:'flex', flexDirection:'column', padding:'0 0 20px', height:'100vh', position:'fixed', left:0, top:0, zIndex:100, boxShadow:'2px 0 16px rgba(0,0,0,0.12)' }}>
      <div style={{ padding:'26px 22px 18px', borderBottom:'1px solid rgba(255,255,255,0.15)' }}>
        <div style={{ fontWeight:800, fontSize:26, color:'#fff', letterSpacing:'-1px' }}>TALIX</div>
        <div style={{ fontSize:11, color:'rgba(255,255,255,0.6)', marginTop:2, fontWeight:500 }}>Trueque Universitario · USIL</div>
      </div>
      <nav style={{ flex:1, padding:'14px 12px', display:'flex', flexDirection:'column', gap:3 }}>
        {nav.map(n=>(
          <button key={n.key} onClick={()=>setPage(n.key)} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px', borderRadius:14, border:'none', cursor:'pointer', textAlign:'left', width:'100%', background:page===n.key?'rgba(255,255,255,0.18)':'transparent', color:page===n.key?'#fff':'rgba(255,255,255,0.65)', fontWeight:page===n.key?600:400, fontSize:14, fontFamily:'Poppins', transition:'all 0.15s' }}
            onMouseEnter={e=>{ if(page!==n.key) e.currentTarget.style.background='rgba(255,255,255,0.09)'; }}
            onMouseLeave={e=>{ if(page!==n.key) e.currentTarget.style.background='transparent'; }}
          >
            <span style={{fontSize:17}}>{n.icon}</span>{n.label}
          </button>
        ))}
      </nav>
      <div style={{ padding:'14px 16px 0', borderTop:'1px solid rgba(255,255,255,0.12)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
          <div style={{ width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.2)', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:700, fontSize:13, flexShrink:0 }}>
            {(currentUser?.displayName||'U').split(' ').map(w=>w[0]).join('').slice(0,2)}
          </div>
          <div style={{ minWidth:0 }}>
            <div style={{ color:'#fff', fontSize:13, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{currentUser?.displayName||'Usuario'}</div>
            <div style={{ color:'rgba(255,255,255,0.45)', fontSize:11 }}>{currentUser?.faculty?.split(' ')[0]||'USIL'}</div>
          </div>
        </div>
        <button onClick={onLogout} style={{ width:'100%', padding:'8px', background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:10, color:'rgba(255,255,255,0.45)', fontFamily:'Poppins', fontSize:12, cursor:'pointer' }}>Cerrar sesión</button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState(()=>localStorage.getItem('talix_mode')||'student');
  const [loggedIn, setLoggedIn] = useState(()=>localStorage.getItem('talix_logged')==='1');
  const [adminLoggedIn, setAdminLoggedIn] = useState(()=>localStorage.getItem('talix_admin')==='1');
  const [termsAccepted, setTermsAccepted] = useState(()=>localStorage.getItem('talix_terms')==='1');
  const [currentUser, setCurrentUser] = useState(()=>Auth.getCurrentUser());
  const [page, setPage] = useState(()=>localStorage.getItem('talix_page')||'feed');
  const [selectedItem, setSelectedItem] = useState(null);
  const [publicUser, setPublicUser] = useState(null);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [toast, setToast] = useState(null);
  const [tweaks, setTweaks] = useState(()=>{
    try { return JSON.parse(localStorage.getItem('talix_tweaks')||'null')||TWEAK_DEFAULTS; }
    catch { return TWEAK_DEFAULTS; }
  });

  const theme = THEMES[tweaks.theme]||THEMES.azul;

  const showToast = (message, type='success') => { setToast({ message, type }); };

  useEffect(()=>localStorage.setItem('talix_mode', mode),[mode]);
  useEffect(()=>{ if(loggedIn) localStorage.setItem('talix_logged','1'); else localStorage.removeItem('talix_logged'); },[loggedIn]);
  useEffect(()=>{ if(adminLoggedIn) localStorage.setItem('talix_admin','1'); else localStorage.removeItem('talix_admin'); },[adminLoggedIn]);
  useEffect(()=>{ if(termsAccepted) localStorage.setItem('talix_terms','1'); },[termsAccepted]);
  useEffect(()=>localStorage.setItem('talix_page', page),[page]);
  useEffect(()=>{
    localStorage.setItem('talix_tweaks', JSON.stringify(tweaks));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:tweaks }, '*');
  },[tweaks]);
  useEffect(()=>{
    const handler = (e)=>{
      if(e.data?.type==='__activate_edit_mode') setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return ()=>window.removeEventListener('message', handler);
  },[]);

  const handleLogin = () => {
    const user = Auth.getCurrentUser();
    setCurrentUser(user);
    if(!termsAccepted) {
      // show terms first, then proceed
      setLoggedIn(true);
    } else {
      setLoggedIn(true);
      setPage('feed');
    }
  };

  const handleTermsAccept = () => {
    setTermsAccepted(true);
    setPage('feed');
  };

  const handleLogout = () => {
    Auth.logout();
    setLoggedIn(false);
    setCurrentUser(null);
    setPage('feed');
    localStorage.removeItem('talix_logged');
  };

  const tweakEl = <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />;
  const toastEl = toast && <TToast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />;

  // ── ADMIN FLOW ──
  if (mode==='admin') {
    if (!adminLoggedIn) return (<>{<AdminLoginPage onAdminLogin={()=>setAdminLoggedIn(true)} onBack={()=>setMode('student')} />}{tweakEl}</>);
    return (<>{<AdminDashboard onLogout={()=>{ setAdminLoggedIn(false); localStorage.removeItem('talix_admin'); setMode('student'); }} />}{tweakEl}</>);
  }

  // ── STUDENT: NOT LOGGED IN ──
  if (!loggedIn) return (
    <>
      <LoginPage onLogin={handleLogin} onAdminAccess={()=>setMode('admin')} theme={theme} />
      {tweakEl}
    </>
  );

  // ── TERMS GATE ──
  if (!termsAccepted) return (
    <>
      <div style={{ minHeight:'100vh', background:theme.bg, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ fontSize:48, color:'#CCC' }}>♻️</div>
      </div>
      <TermsModal onAccept={handleTermsAccept} />
      {tweakEl}
    </>
  );

  // ── MAIN APP ──
  const renderPage = () => {
    const props = { currentUser, theme, showToast, setPage };
    switch(page) {
      case 'feed':          return <FeedPage {...props} setSelectedItem={setSelectedItem} setPublicUser={setPublicUser} />;
      case 'detail':        return <ItemDetailPage {...props} item={selectedItem} setPublicUser={setPublicUser} />;
      case 'post':          return <PostPage {...props} />;
      case 'chat':          return <ChatPage {...props} />;
      case 'dashboard':     return <DashboardPage {...props} />;
      case 'profile':       return <ProfilePage {...props} />;
      case 'publicprofile': return <PublicProfilePage {...props} userId={publicUser} />;
      default:              return <FeedPage {...props} setSelectedItem={setSelectedItem} setPublicUser={setPublicUser} />;
    }
  };

  return (
    <div style={{ display:'flex', height:'100vh', background:theme.bg, overflow:'hidden' }}>
      <Sidebar page={page} setPage={setPage} currentUser={currentUser} theme={theme} onLogout={handleLogout} />
      <div style={{ marginLeft:220, flex:1, overflowY:page==='chat'?'hidden':'auto', height:'100vh', display:'flex', flexDirection:'column' }}>
        {renderPage()}
      </div>
      {tweakEl}
      {toastEl}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
